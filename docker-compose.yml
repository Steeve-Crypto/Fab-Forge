version: '3.8'

services:
  fabforge-backend:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    command: uvicorn dashboard.fastapi_backend:app --host 0.0.0.0 --port 8000 --reload

  mqtt-broker:
    image: eclipse-mosquitto
    ports:
      - "1883:1883"