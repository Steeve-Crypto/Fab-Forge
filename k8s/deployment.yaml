apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabforge-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fabforge
  template:
    metadata:
      labels:
        app: fabforge
    spec:
      containers:
      - name: fabforge
        image: fabforge:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fabforge-service
spec:
  selector:
    app: fabforge
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: LoadBalancer